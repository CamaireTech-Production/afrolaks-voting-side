services:

  # ── Next.js 15 — public voting site + API routes ────────────────────────────
  afrolaks-frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY:              ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:          ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID:           ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:       ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:  ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID:               ${NEXT_PUBLIC_FIREBASE_APP_ID}
    container_name: afrolaks-frontend
    restart: unless-stopped
    environment:
      NODE_ENV:             production
      FIREBASE_PROJECT_ID:  ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.afrolaks.rule=Host(`afrolaks.online`) || Host(`www.afrolaks.online`)"
      - "traefik.http.routers.afrolaks.entrypoints=websecure"
      - "traefik.http.routers.afrolaks.tls.certresolver=mytlschallenge"
      - "traefik.http.services.afrolaks.loadbalancer.server.port=3000"

  # ── Vite/React — admin dashboard (static SPA served by nginx) ───────────────
  afrolaks-admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY:             ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN:         ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID:          ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET:      ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID:              ${VITE_FIREBASE_APP_ID}
    container_name: afrolaks-admin
    restart: unless-stopped
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.afrolaks-admin.rule=Host(`admin.afrolaks.online`)"
      - "traefik.http.routers.afrolaks-admin.entrypoints=websecure"
      - "traefik.http.routers.afrolaks-admin.tls.certresolver=mytlschallenge"
      - "traefik.http.services.afrolaks-admin.loadbalancer.server.port=80"

networks:
  traefik_network:
    external: true
